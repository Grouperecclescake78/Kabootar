    <circle cx="26" cy="30" r="5.5"/>
    <circle cx="70" cy="30" r="5.5"/>
    <circle cx="26" cy="68" r="5.5"/>
    <circle cx="70" cy="68" r="5.5"/>
  </g>
  <!-- tricolour accent -->
  <g>
    <rect x="30" y="82" width="12" height="4" rx="2" fill="#FF9933"/>
    <rect x="42" y="82" width="12" height="4" rx="2" fill="#FFFFFF"/>
