name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tags

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Patch the legacy mesh plugin for a modern toolchain
        run: bash tool/patch_nearby_plugin.sh

      - name: Enable core-library desugaring (for local notifications)
        run: bash tool/patch_gradle.sh

      - name: Build release APKs (per-ABI, ~22MB each vs a 60MB universal)
        run: flutter build apk --release --split-per-abi

      - name: Stage APKs with release filenames
        run: |
          cd build/app/outputs/flutter-apk
          ver=$(grep -m1 '^version:' "$GITHUB_WORKSPACE/pubspec.yaml" \
            | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "kabootar-v${ver}-${abi}.apk"
          done
          ls -la kabootar-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kabootar-apks
          path: build/app/outputs/flutter-apk/kabootar-*.apk
          if-no-files-found: error

      - name: Publish the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Kabootar ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: build/app/outputs/flutter-apk/kabootar-*.apk
          fail_on_unmatched_files: true
