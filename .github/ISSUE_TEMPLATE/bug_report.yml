name: "🐛 Bug report"
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve studchat. Because the mesh is peer-to-peer,
        details about your devices and range matter a lot.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I ... I expected ... but instead ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open studchat on both phones
        2. ...
        3. See error
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices & OS
      description: Model and Android/iOS version of every device involved.
      placeholder: "Redmi Note 10 (Android 12) <-> Pixel 7 (Android 15)"
    validations:
      required: true
  - type: dropdown
    id: distance
    attributes:
      label: Roughly how far apart were the devices?
      options:
        - Same room (< 5 m)
        - Same floor (5-30 m)
        - Different floors / far (> 30 m)
        - Not applicable
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Output of `adb logcat | grep -iE 'flutter|studchat'` if you have it."
      render: shell
  - type: input
    id: version
    attributes:
      label: studchat version / commit
      placeholder: "1.0.0 or commit sha"
